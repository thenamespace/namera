# Git hooks (from klarity's monorepo preset, with the configs in .config/).
min_version: 2.1.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,md}"
      run: pnpm exec dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: solidity
      root: contracts/
      glob: "*.sol"
      run: forge fmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --config .config/commitlint.config.ts --edit {1}

pre-push:
  jobs:
    - name: check
      run: pnpm exec turbo --root-turbo-json .config/turbo.json run lint typecheck && pnpm test && pnpm test:contracts
