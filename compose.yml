services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: namera-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: namera
      POSTGRES_USER: namera
      POSTGRES_PASSWORD: namera
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namera -d namera"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
