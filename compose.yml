services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agent-wallet-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent-wallet
      POSTGRES_USER: agent-wallet
      POSTGRES_PASSWORD: agent-wallet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent-wallet -d agent-wallet"]
      interval: 5s
      timeout: 5s
      retries: 5
