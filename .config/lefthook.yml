# Mirrors klarity's lefthook/monorepo preset. Not extended: lefthook lets extended files override
# local jobs, and these jobs must pass the .config/ tool configs explicitly.
min_version: 2.1.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,scss,md,mdx,yaml,yml}"
      run: pnpm exec oxfmt -c .config/oxfmt.config.ts --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint -c .config/oxlint.config.ts --deny-warnings {staged_files}
    - name: solidity
      root: contracts/
      glob: "*.sol"
      run: forge fmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --config .config/commitlint.config.ts --edit {1}

pre-push:
  jobs:
    - name: check
      run: pnpm run check
