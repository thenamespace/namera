server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/namera-headers.conf;
    add_header Cache-Control "no-cache" always;

    location = /_headers {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/namera-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
