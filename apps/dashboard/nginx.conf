# Only the credential-free sign-in entry is public search content. Use the
# original request URI so SPA fallback rewrites cannot change this decision.
map $request_uri $dashboard_robots {
    default "noindex, nofollow, noarchive";
    ~^/auth/?$ "index, follow, max-image-preview:large";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/namera-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag $dashboard_robots always;

    location = /_headers {
        return 404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ \.(png|svg|ico|xml|txt)$ {
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/namera-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
