packages:
  - "apps/*"
  - "contracts"
  - "packages/*"
  - "tools/*"

# Versions shared by the workspace: the toolchain every package uses (TypeScript, Node types,
# Oxlint, Vitest) and dependencies referenced by more than one package.json. A dependency only one
# package uses is pinned in that package.json instead.
catalog:
  "@effect/tsgo": "0.73.2"
  "@effect/vitest": "4.1.5"
  "@interfere/landmines": "0.1.1"
  "@types/node": "26.6.6"
  effect: "4.1.5"
  klarity: "0.3.0"
  oxlint: "1.94.0"
  oxlint-tsgolint: "7.0.2007"
  tsdown: "0.23.7"
  typescript: "7.0.2"
  viem: "2.57.20"
  vitest: "5.1.1"

# A release must be a day old before it installs, so a compromised version is likely caught first.
minimumReleaseAge: 1440

# Pinned to their latest release on purpose: Effect and the Oxc tools (with their platform
# binaries) ship together and are upgraded as soon as they are out.
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"

allowBuilds:
  lefthook: true
