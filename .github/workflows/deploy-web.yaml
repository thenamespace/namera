---
name: Deploy - Web

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Staging branch, tag or SHA; production builds the main workflow commit
        required: false
        type: string
        default: "main"
      environment:
        description: Target environment
        required: false
        type: choice
        options:
          - prod
          - staging
        default: "prod"

jobs:
  call-build:
    name: build
    # A one-entry matrix is the only static map a reusable-workflow call can
    # read in `with`. Vite bakes these into the bundle at build time.
    strategy:
      matrix:
        dotenv:
          - prod: |
              VITE_API_URL=https://api.namera.ai
              VITE_SITE_URL=https://namera.ai
            staging: |
              VITE_API_URL=https://staging.api.namera.ai
              VITE_SITE_URL=https://staging.namera.ai
    uses: ./.github/workflows/build-and-push.yaml
    secrets:
      REPOSITORY_DISPATCH_PAT: ${{ secrets.REPOSITORY_DISPATCH_PAT }}
    permissions:
      contents: "read"
      id-token: "write"
    with:
      app_name: namera-core-web
      dockerfile: apps/web/Dockerfile
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      dotenv: ${{ matrix.dotenv[inputs.environment] }}
