---
name: Workflow - Build and Push Docker Image

on:
  workflow_call:
    secrets:
      REPOSITORY_DISPATCH_PAT:
        required: true
        description: "Triggers a PR creation in the infra repository"
      POSTHOG_CLI_API_KEY:
        required: false
        description: "PostHog source-map upload token; required for production web/dashboard builds"
    inputs:
      app_name:
        description: App/image name, also the infra app directory name
        required: true
        type: string
      infra_app:
        description: App group directory under applications/apps in the infra repo
        required: false
        type: string
        default: "namera-core"
      dockerfile:
        description: Path to the app's Dockerfile (build context is repo root)
        required: true
        type: string
      environment:
        required: false
        type: string
        default: "prod"
      ref:
        description: Staging ref; production accepts main only and builds the dispatch commit
        required: false
        type: string
        default: ""
      dotenv:
        description: Optional .env content baked into the build (VITE_ vars)
        required: false
        type: string
        default: ""

env:
  region: europe-west3
  project_id: prod-9427
  artifact_repository: namera-core
  workload_identity_provider: projects/397196751430/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.app_name }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Validate deployment target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            prod)
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::Production deployments must be dispatched from main."
                exit 1
              fi
              case "$DEPLOY_REF" in
                ""|main|refs/heads/main) ;;
                *)
                  echo "::error::Production accepts main only. Roll back through an approved existing image."
                  exit 1
                  ;;
              esac
              ;;
            staging) ;;
            *)
              echo "::error::Unknown deployment environment."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.environment == 'prod' && github.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.project_id }}
          workload_identity_provider: ${{ env.workload_identity_provider }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure docker for artifact registry
        run: |
          gcloud auth configure-docker ${{ env.region }}-docker.pkg.dev

      - name: Get metadata for tags
        id: meta
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "image_tag=$(git rev-parse --short HEAD)-$DEPLOY_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ env.region }}-docker.pkg.dev/${{ env.project_id }}
          REPOSITORY: ${{ env.artifact_repository }}
          IMAGE_NAME: ${{ inputs.app_name }}
          DOTENV: ${{ inputs.dotenv }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_PUBLIC_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG"
          if [[ "$DOCKERFILE" == apps/web/Dockerfile || "$DOCKERFILE" == apps/dashboard/Dockerfile ]]; then
            if [[ "$DEPLOY_ENVIRONMENT" == prod ]]; then
              missing_posthog_config=false
              if [[ -z "$POSTHOG_PUBLIC_KEY" ]]; then
                echo "::error::Missing Actions variable VITE_POSTHOG_KEY in the prod environment or repository."
                missing_posthog_config=true
              fi
              if [[ -z "$POSTHOG_CLI_API_KEY" ]]; then
                echo "::error::Missing Actions secret POSTHOG_CLI_API_KEY. Configure it in prod or the repository and pass it to this reusable workflow."
                missing_posthog_config=true
              fi
              if [[ -z "$POSTHOG_CLI_PROJECT_ID" ]]; then
                echo "::error::Missing Actions variable POSTHOG_CLI_PROJECT_ID in the prod environment or repository."
                missing_posthog_config=true
              fi
              if [[ "$missing_posthog_config" == true ]]; then exit 1; fi
              DOTENV+=$'\n'"VITE_POSTHOG_KEY=$POSTHOG_PUBLIC_KEY"
            else
              DOTENV+=$'\n'"VITE_POSTHOG_KEY="
              POSTHOG_CLI_API_KEY=""
            fi
          else
            POSTHOG_CLI_API_KEY=""
          fi
          docker build -f "$DOCKERFILE" --build-arg DOTENV="$DOTENV" \
            --build-arg POSTHOG_CLI_PROJECT_ID="$POSTHOG_CLI_PROJECT_ID" \
            --build-arg POSTHOG_RELEASE_VERSION="$GITHUB_SHA" \
            --secret id=posthog_api_key,env=POSTHOG_CLI_API_KEY -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_PAT }}
          repository: thenamespace/infra
          event-type: image-tag-update
          client-payload: >-
            {"repository": "${{ inputs.app_name }}",
            "infra_app": "${{ inputs.infra_app }}",
            "image_tag": "${{ steps.meta.outputs.image_tag }}",
            "environment": "${{ inputs.environment }}"}
