---
name: Deploy - Server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: false
        type: string
        default: "main"
      environment:
        description: Target environment
        required: false
        type: choice
        options:
          - prod
          - staging
        default: "prod"

jobs:
  call-build:
    uses: ./.github/workflows/build-and-push.yaml
    secrets: inherit
    permissions:
      contents: "read"
      id-token: "write"
    with:
      app_name: namera-core-server
      dockerfile: apps/server/Dockerfile
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      # No dotenv: database and API secrets are runtime values supplied by the
      # infra app, and must not be baked into the image.
