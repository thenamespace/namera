# Pull requests, pushes to main, the merge queue and manual runs: formatting, lint, types, builds
# and tests (and package metadata when the repository publishes), plus a security audit of the
# workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  check:
    # The version PR only changes versions and changelogs, and GitHub does not run workflows on
    # PRs the workflow token opens; dispatch CI on its branch to check it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm check
      - run: pnpm pack:check

  # The SDK's runtime smoke test on every runtime it supports besides Node 26 and workerd, which `pnpm check` covers.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-22, bun, deno, chromium]
    env:
      NAMERA_RUNTIME_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - if: matrix.runtime == 'node-22'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - if: matrix.runtime == 'node-22'
        run: node node_modules/vitest/vitest.mjs run --project @namera-ai/sdk/runtime
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Vitest's default forks pool needs Node's IPC channel; Bun runs the threads pool.
      - if: matrix.runtime == 'bun'
        run: bun run --bun vitest run --pool=threads --project @namera-ai/sdk/runtime
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - if: matrix.runtime == 'deno'
        run: deno run -A node_modules/vitest/vitest.mjs run --project @namera-ai/sdk/runtime
      - if: matrix.runtime == 'chromium'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.runtime == 'chromium'
        run: pnpm exec vitest run --project @namera-ai/sdk/browser

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pipx install slither-analyzer==0.11.6 && pipx install halmos==0.3.3
      - name: Slither
        run: pnpm --filter @namera-ai/contracts-sol analyze
      - name: Halmos
        run: pnpm --filter @namera-ai/contracts-sol symbolic

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Annotations instead of code scanning: SARIF uploads would need `security-events: write`.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
