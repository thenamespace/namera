# Pull requests, pushes to main, the merge queue and manual runs. Each job runs one stage of
# `pnpm check`, so a failure names the stage; tests also run on the oldest supported Node, the SDK's
# runtime smoke test on Bun, Deno and Chromium, and the contracts through Slither and Halmos.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  static:
    name: Static
    # GitHub does not run workflows on PRs the workflow token opens: the version PR is checked by
    # dispatching CI on its branch, and again by the release before publishing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm ox-pin
      - run: pnpm circular
      - run: pnpm docs:check
      # Barrels, exports maps, the version module, @namera-ai/contracts and the devnet's bytecode.
      - name: Require generated files to be committed
        run: pnpm codegen:check

  types:
    name: Types
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm typecheck:tsc
      - run: pnpm test:types

  build:
    name: Build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm api-snapshot --check
      - run: pnpm bundle-size
      - run: pnpm type-cost
      - run: pnpm pack:check

  test:
    name: Test (Node ${{ matrix.node || 'from .node-version' }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Empty uses .node-version; 22.19.0 is the oldest Node the packages support (`engines`).
        node: ["", "22.19.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}
      - run: pnpm test
      - run: pnpm test:docs

  contracts:
    name: Contracts
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Foundry must be on PATH before install: the contracts package installs Soldeer deps then.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm test:contracts

  # The SDK's runtime smoke test on the runtimes the Test job doesn't cover (it runs Node and workerd).
  runtime:
    name: Runtime (${{ matrix.runtime }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, chromium]
    env:
      NAMERA_RUNTIME_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Vitest's default forks pool needs Node's IPC channel; Bun runs the threads pool.
      - if: matrix.runtime == 'bun'
        run: bun run --bun vitest run --pool=threads --project @namera-ai/sdk/runtime
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - if: matrix.runtime == 'deno'
        run: deno run -A node_modules/vitest/vitest.mjs run --project @namera-ai/sdk/runtime
      - if: matrix.runtime == 'chromium'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.runtime == 'chromium'
        run: pnpm exec vitest run --project @namera-ai/sdk/browser

  # The Node key stores against a real OS keychain: the suite only runs when asked, as it writes to the machine's
  # keychain (a unique service, removed afterwards).
  keychain:
    name: Keychain (macOS)
    needs: static
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      NAMERA_KEYCHAIN_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pnpm exec vitest run --project @namera-ai/sdk packages/sdk/test/node

  analyze:
    name: Contract analysis
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
      - run: pipx install slither-analyzer==0.11.6 && pipx install halmos==0.3.3
      - name: Slither
        run: pnpm --filter @namera-ai/contracts-sol analyze
      - name: Halmos
        run: pnpm --filter @namera-ai/contracts-sol symbolic

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Annotations instead of code scanning: SARIF uploads would need `security-events: write`.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
