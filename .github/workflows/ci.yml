name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.namera.ai' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack:check
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: namera_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d namera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @namera-ai/server... build
      - run: pnpm --filter @namera-ai/server test
        env:
          NAMERA_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
