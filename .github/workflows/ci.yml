name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  analyze:
    name: Analyze contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pipx install slither-analyzer==0.11.6 && pipx install halmos==0.3.3
      - name: Slither
        run: pnpm --filter @namera-ai/contracts-sol analyze
      - name: Halmos
        run: pnpm --filter @namera-ai/contracts-sol symbolic
