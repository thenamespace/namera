name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.namera.ai' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - run: pnpm check
      - run: pnpm pack:check
  tests:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: cli
            filters: --filter=@namera-ai/cli
          - group: packages
            filters: --filter=!@namera-ai/server --filter=!@namera-ai/cli
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test with bounded package and worker concurrency
        run: pnpm exec turbo run test ${{ matrix.filters }} --concurrency=2
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: namera_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d namera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @namera-ai/server... build
      - name: Test PostgreSQL with reproducible shuffled order
        run: pnpm --filter @namera-ai/server test --sequence.shuffle --sequence.seed=${{ github.run_number }}
        env:
          NAMERA_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
